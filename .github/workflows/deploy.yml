name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartfarm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Configure SSH
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          test -n "$CPANEL_SSH_KEY"
          test -n "$CPANEL_SSH_PASSPHRASE"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -q -p -P "$CPANEL_SSH_PASSPHRASE" -N '' -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' '[briva.co.ke]:1980 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAPzqd63LQYEk9Oyz4o2SFGMG+F75tgSGnJrs24EZjDq' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Show matching public key for cPanel
        run: |
          {
            echo '### SSH public key to authorize in cPanel'
            echo
            echo 'This public key is derived from the CPANEL_SSH_KEY repository secret.'
            echo
            echo '```text'
            ssh-keygen -y -f ~/.ssh/id_ed25519
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select compatible cPanel PHP CLI
        run: |
          php_binary=$(ssh -i ~/.ssh/id_ed25519 -p 1980 -o BatchMode=yes brivacok@briva.co.ke 'for php in /opt/cpanel/ea-php*/root/usr/bin/php; do
            [ -x "$php" ] || continue
            version=$("$php" -r "echo PHP_VERSION_ID;")
            if [ "$version" -ge 80300 ]; then printf "%s\n" "$php"; fi
          done' | sort -V | tail -n 1)
          if [[ -z "$php_binary" ]]; then
            echo '::error::No cPanel PHP CLI version 8.3 or newer is installed.'
            exit 1
          fi
          echo "CPANEL_PHP_BIN=$php_binary" >> "$GITHUB_ENV"
          printf 'Using cPanel PHP CLI: %s\n' "$php_binary"

      - name: Upload application
        run: |
          tar -czf - \
            --exclude='./.env' \
            --exclude='./storage' \
            --exclude='./public/storage' \
            --exclude='./.git' \
            --exclude='./node_modules' \
            . \
          | ssh -i ~/.ssh/id_ed25519 -p 1980 -o BatchMode=yes brivacok@briva.co.ke \
            'mkdir -p /home3/brivacok/smartfarm.briva.co.ke && tar -xzf - -C /home3/brivacok/smartfarm.briva.co.ke'

      - name: Run Laravel deployment tasks
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 1980 -o BatchMode=yes \
            brivacok@briva.co.ke \
            "cd /home3/brivacok/smartfarm.briva.co.ke && $CPANEL_PHP_BIN artisan optimize:clear && $CPANEL_PHP_BIN artisan migrate --force && $CPANEL_PHP_BIN artisan config:cache && $CPANEL_PHP_BIN artisan view:cache"